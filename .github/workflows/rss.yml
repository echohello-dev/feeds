name: RSS to Discord (via feedhub)

on:
  schedule:
    # Every 15 minutes. OpenRouter doesn't push minute-scale events.
    # For sub-5-min cadence, see https://docs.github.com/en/actions/using-workflows/events-that-trigger-workflows#schedule
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  poll:
    uses: echohello-dev/feedhub/.github/workflows/rss.yml@main
    with:
      feeds-path: feeds.json
      state-path: state.json
    secrets:
      discord-webhook: ${{ secrets.DISCORD_WEBHOOK_OPENROUTER }}