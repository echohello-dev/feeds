name: RSS to Discord (via feedhub)

on:
  schedule:
    # Daily. OpenRouter model drops and the MCP blog aren't minute-scale.
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  poll:
    runs-on: ubuntu-latest
    env:
      DISCORD_WEBHOOK_DEFAULT: ${{ secrets.DISCORD_WEBHOOK_OPENROUTER }}
      DISCORD_WEBHOOK_OPENROUTER: ${{ secrets.DISCORD_WEBHOOK_OPENROUTER }}
      DISCORD_WEBHOOK_MCP: ${{ secrets.DISCORD_WEBHOOK_MCP }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: echohello-dev/feedhub@main
        with:
          feeds-path: feeds.json
          state-path: state.json
